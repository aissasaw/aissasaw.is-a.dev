<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aissa Saw | الموقع الرسمي للفنان عيسى صاو</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <!-- ========================================== -->
    <!-- ١. كود أرشفة جوجل (Google Search Console) -->
    <!-- استبدل "YOUR_VERIFICATION_CODE" بالكود الخاص بك -->
    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" />

    <!-- ضع كود التتبع الخاص بأدسنس هنا داخل الـ head -->

    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-color: #d4af37; /* ذهبي فخم */
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        /* الهيدر وقائمة التنقل */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(11, 11, 11, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-menu {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-link {
            font-weight: 600;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-color);
        }

        /* الواجهة الرئيسية (Hero Section) */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px 20px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 100%);
        }

        .hero-content {
            max-width: 700px;
            width: 100%;
        }

        /* إطار الصورة الشخصية للفنان */
        .profile-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        /* أيقونة يوتيوب المثبتة كشعار فوق الصورة */
        .youtube-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: #ff0000;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 2px solid var(--bg-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hero-content h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .hero-content h1 span {
            color: var(--accent-color);
        }

        .hero-content .subtitle {
            font-size: 18px;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .hero-content .bio-brief {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* أيقونة MP3 الرئيسية */
        .mp3-action-container {
            margin-bottom: 30px;
        }

        .mp3-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            background-color: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-weight: 700;
            border-radius: 30px;
            font-size: 16px;
        }

        .mp3-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* روابط التواصل الاجتماعي كاملة */
        .social-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-color);
        }

        .social-icon:hover {
            color: var(--bg-color);
            transform: translateY(-3px);
        }

        .social-icon.youtube:hover { background-color: #ff0000; border-color: #ff0000; }
        .social-icon.facebook:hover { background-color: #1877f2; border-color: #1877f2; }
        .social-icon.instagram:hover { background-color: #e1306c; border-color: #e1306c; }
        .social-icon.tiktok:hover { background-color: #000000; border-color: #000000; color: #fff; }
        .social-icon.soundcloud:hover { background-color: #ff5500; border-color: #ff5500; }
        .social-icon.audiomack:hover { background-color: #ffa200; border-color: #ffa200; }

        /* الأقسام والمحتوى */
        section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background-color: var(--accent-color);
            margin: 8px auto 0 auto;
        }

        /* تضمين مشغل الأغاني (Audiomack أو SoundCloud) */
        .player-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
        }

        /* المدونة الفنية اليومية */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .blog-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .blog-content {
            padding: 20px;
        }

        .blog-meta {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .blog-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .blog-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* الإعلانات داخل الموقع (AdSense Slots) */
        .adsense-placeholder {
            background-color: #111;
            border: 1px dashed #333;
            padding: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            margin: 30px 0;
            border-radius: 4px;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .hero-content h1 { font-size: 32px; }
        }
    </style>
</head>
