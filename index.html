<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي للفنان عيسى صاو | Aissa Saw</title>
    <!-- استدعاء خط تاجويل ومكتبة الرموز والأيقونات الفنية -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-color: #0b0b0b;
            --surface-color: #161616;
            --accent-color: #ff5500; /* لون موسيقي احترافي متناسق مع Audiomack */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* الهيدر وقائمة التنقل */
        header {
            background-color: rgba(22, 22, 22, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.7);
            border-bottom: 1px solid #222;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-right: 25px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        /* القسم الرئيسي - Hero */
        .hero {
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://unsplash.com') no-repeat center center/cover;
            padding-top: 80px;
        }

        .hero-content h1 {
            font-size: 56px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .hero-content p {
            font-size: 22px;
            color: var(--text-secondary);
            margin-bottom: 35px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 35px;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: #ff6a1a;
            box-shadow: 0 6px 20px rgba(255, 85, 0, 0.6);
        }

        /* حاويات الأقسام */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 50px;
        }

        .section-title span {
            color: var(--accent-color);
        }

        /* السيرة الذاتية المفصلة */
        .about-section {
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #222;
            margin-bottom: 30px;
        }

        .biography-text {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            text-align: justify;
            border-bottom: 1px solid #333;
            padding-bottom: 25px;
        }

        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .info-item {
            font-size: 17px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-color);
        }

        .info-item strong {
            color: #fff;
            display: block;
            margin-bottom: 5px;
        }

        /* خط زمني للمحطات والخبرة المهنية */
        .timeline {
            margin-top: 50px;
        }

        .timeline-item {
            position: relative;
            padding-right: 30px;
            margin-bottom: 30px;
            border-right: 2px solid var(--accent-color);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            right: -7px;
            top: 5px;
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .timeline-date {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
        }

        .timeline-title {
            font-size: 20px;
            margin: 5px 0;
            color: #fff;
        }

        /* قسم الاستماع والأعمال الموسيقية */
        .audio-section {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .audio-player-mock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 15px 25px;
            border-radius: 50px;
            max-width: 700px;
            margin: 20px auto;
            border: 1px solid #333;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mp3-icon {
            font-size: 28px;
            color: var(--accent-color);
        }

        /* المدونة اليومية */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .blog-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            border: 1px solid #222;
            transition: transform 0.3s;
        }

        .blog-card:hover {
            transform: translateY(-5px);
        }

        .blog-content {
            padding: 30px;
        }

        .blog-date {
            font-size: 13px;
            color: var(--accent-color);
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .blog-title {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .blog-excerpt {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* أزرار التواصل الاجتماعي */
        .social-container {
            text-align: center;
            margin-top: 40px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            list-style: none;
            padding: 20px 0;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            background-color: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        /* ألوان السوشيال ميديا عند التمرير */
        .social-links .facebook:hover { background-color: #1877f2; transform: translateY(-5px); }
        .social-links .twitter:hover { background-color: #1da1f2; transform: translateY(-5px); }
        .social-links .instagram:hover { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); transform: translateY(-5px); }
        .social-links .tiktok:hover { background-color: #010101; border-color: #ff0050; transform: translateY(-5px); color: #00f2fe; }
        .social-links .youtube:hover { background-color: #ff0000; transform: translateY(-5px); }
        .social-links .whatsapp:hover { background-color: #25d366; transform: translateY(-5px); }
        .social-links .paypal:hover { background-color: #003087; transform: translateY(-5px); }
        .social-links .audiomack-icon:hover { background-color: #ff5500; transform: translateY(-5px); }

        footer {
            background-color: var(--surface-color);
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            border-top: 1px solid #222;
        }

        footer p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 15px; }
            .hero-content h1 { font-size: 34px; }
            .audio-player-mock { flex-direction: column; gap: 15px; border-radius: 20px; text-align: center; }
        }
    </style>
</head>
