<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aissa Saw | الموقع الرسمي للفنان عيسى صاو</title>
    <!-- الروابط الخارجية للخطوط والأيقونات الاحترافية -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-dark: #08080a;
            --surface-card: #121216;
            --surface-hover: #1c1c24;
            --accent-glow: #ff5500; /* البرتقالي الناري الخاص بالمنصات الموسيقية العالمية */
            --accent-sub: #00f2fe;  /* نيون سايبربانك لإضفاء لمسة عصرية */
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* شريط التنقل العلوي (المشوش والمستقبلي) */
        header {
            background-color: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--accent-glow);
            text-shadow: 0 0 15px rgba(255, 85, 0, 0.5);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* القسم الرئيسي (البطل - الشاشة الافتتاحية) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(255, 85, 0, 0.15) 0%, rgba(8, 8, 10, 1) 70%), 
                        url('https://unsplash.com') no-repeat center center/cover;
            padding: 0 20px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(transparent, var(--bg-dark));
        }

        .hero-content h2 {
            font-size: 20px;
            color: var(--accent-glow);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .hero-content h1 {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: 24px;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 40px;
            font-style: italic;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            background-color: var(--accent-glow);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 25px rgba(255, 85, 0, 0.4);
        }

        .btn:hover {
            transform: translateY(-5px);
            background-color: #ff6a1a;
            box-shadow: 0 8px 35px rgba(255, 85, 0, 0.6);
        }

        /* الحاوية الأساسية للأقسام */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .section-title {
            font-size: 40px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }
        .section-title span {
            color: var(--accent-glow);
        }

        /* قسم السيرة الذاتية الاحترافية */
        .bio-wrapper {
            background-color: var(--surface-card);
            border-radius: 24px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .bio-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-glow), var(--accent-sub));
        }

        .bio-lead {
            font-size: 20px;
            color: #fff;
            margin-bottom: 30px;
            line-height: 1.8;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 25px;
        }

        .bio-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .meta-item i {
            color: var(--accent-glow);
            font-size: 20px;
            margin-bottom: 10px;
            display: block;
        }

        .meta-item h4 {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .meta-item p {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        /* قسم التسجيلات والأستوديو (الجدول الزمني الفني) */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background: rgba(255, 255, 255, 0.1);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -1px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            box-sizing: border-box;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -8px;
            background-color: var(--bg-dark);
            border: 4px solid var(--accent-glow);
            top: 15px;
            border-radius: 50%;
            z-index: 1;
        }

        .left { left: 0; text-align: left; }
        .right { left: 50%; text-align: right; }

        .left::after { left: -8px; right: auto; }

        .timeline-content {
            padding: 25px;
            background-color: var(--surface-card);
            position: relative;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .timeline-date {
            font-weight: 900;
            color: var(--accent-glow);
            font-size: 18px;
            margin-bottom: 8px;
            display: block;
        }

        .timeline-content h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .timeline-content p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* قسم الاستماع (الأغاني والمشغلات الصوتية) */
        .audio-wrapper {
            background-color: var(--surface-card);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .track-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.3s ease;
        }

        .track-card:hover {
            background: var(--surface-hover);
            transform: scale(1.01);
            border-color: rgba(255, 85, 0, 0.3);
        }

        .track-details {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mp3-box {
            width: 50px;
            height: 50px;
            background: rgba(255, 85, 0, 0.1);
            border-radius: 12px;

            align-items: center;
